{% extends "base.html" %}
{% block title %}Sign In · Kroma{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 5rem auto; padding: 2.25rem; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);">
  <div style="text-align: center; margin-bottom: 2rem;">
    <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0 0 0.5rem 0; letter-spacing: -0.5px;">Kroma</h1>
    <p class="muted" style="margin: 0; font-size: 0.9rem;">Sign in to access your dashboard</p>
  </div>

  <form method="post" action="{{ url_for('dashboard.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Email or Username</label>
      <input type="text" name="username" value="{{ username or '' }}" required autofocus class="input" placeholder="user@example.com" style="width: 100%; box-sizing: border-box; padding: 0.6rem 0.75rem;">
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Password</label>
      <input type="password" name="password" required class="input" placeholder="••••••••" style="width: 100%; box-sizing: border-box; padding: 0.6rem 0.75rem;">
    </div>

    <button type="submit" class="btn primary" style="width: 100%; padding: 0.65rem; font-size: 0.95rem; font-weight: 600;">Sign In</button>
  </form>
</div>
{% endblock %}
