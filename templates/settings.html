{% extends "base.html" %}
{% block title %}Settings · Kroma{% endblock %}
{% block content %}
<div style="max-width: 700px; margin: 1.5rem auto;">
  <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem;">System Settings</h1>

  <section class="card" style="margin-bottom: 1.5rem;">
    <h2 style="font-size: 1.15rem; font-weight: 600; margin-top: 0;">Browser &amp; Storage</h2>
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label style="font-size: 0.85rem; font-weight: 600;">Chrome / Chromium Executable Path
        <input name="chrome_path" value="{{ chrome_path }}" placeholder="{{ detected or 'Auto-detected Chrome' }}">
      </label>
      <p class="muted" style="font-size: 0.8rem; margin-top: -0.25rem;">Detected: <code>{{ detected or 'Not found' }}</code></p>

      <label style="font-size: 0.85rem; font-weight: 600; margin-top: 0.5rem;">Profiles Storage Directory
        <input name="profiles_dir" value="{{ profiles_dir }}" placeholder="{{ effective_dir }}">
      </label>
      <p class="muted" style="font-size: 0.8rem; margin-top: -0.25rem;">Active: <code>{{ effective_dir }}</code></p>

      <hr style="border: 0; border-top: 1px solid var(--line); margin: 1.25rem 0;">

      <h2 style="font-size: 1.15rem; font-weight: 600; margin-top: 0;">Security &amp; Password</h2>
      <p class="muted" style="font-size: 0.85rem; margin-top: -0.5rem; margin-bottom: 1rem;">Logged in as: <b>{{ session.user.get('username') }}</b></p>

      <label style="font-size: 0.85rem; font-weight: 600;">Current Password
        <input type="password" name="current_password" placeholder="••••••••">
      </label>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.5rem;">
        <div>
          <label style="font-size: 0.85rem; font-weight: 600;">New Password
            <input type="password" name="new_password" placeholder="••••••••">
          </label>
        </div>
        <div>
          <label style="font-size: 0.85rem; font-weight: 600;">Confirm New Password
            <input type="password" name="confirm_password" placeholder="••••••••">
          </label>
        </div>
      </div>

      <button class="btn primary" style="margin-top: 1.25rem; align-self: flex-start; padding: 0.6rem 1.25rem;">Save Changes</button>
    </form>
  </section>
</div>
{% endblock %}
