{% extends "base.html" %}
{% block title %}Initial Setup · Kroma{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 4rem auto; padding: 2.25rem; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);">
  <div style="text-align: center; margin-bottom: 2rem;">
    <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0 0 0.5rem 0; letter-spacing: -0.5px;">Kroma Setup</h1>
    <p class="muted" style="margin: 0; font-size: 0.9rem;">Create your Administrator account to secure the application</p>
  </div>

  <form method="post" action="{{ url_for('dashboard.setup') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Admin Username</label>
      <input type="text" name="username" value="{{ username or 'admin' }}" required autofocus class="input" placeholder="admin" style="width: 100%; box-sizing: border-box; padding: 0.6rem 0.75rem;">
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Email (Firebase Sync & Subscription)</label>
      <input type="email" name="email" value="{{ email or '' }}" placeholder="client@example.com" class="input" style="width: 100%; box-sizing: border-box; padding: 0.6rem 0.75rem;">
      <small class="muted" style="font-size: 0.75rem; display: block; margin-top: 3px;">Used to sync user profile and subscription in Cloud Firestore.</small>
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Password</label>
      <input type="password" name="password" required class="input" placeholder="At least 6 characters" style="width: 100%; box-sizing: border-box; padding: 0.6rem 0.75rem;">
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Confirm Password</label>
      <input type="password" name="confirm_password" required class="input" placeholder="Repeat password" style="width: 100%; box-sizing: border-box; padding: 0.6rem 0.75rem;">
    </div>

    <button type="submit" class="btn primary" style="width: 100%; padding: 0.65rem; font-size: 0.95rem; font-weight: 600;">Create Admin Account</button>
  </form>
</div>
{% endblock %}
